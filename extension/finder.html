<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Apply Kit — Job finder</title>
<link rel="stylesheet" href="kit.css">
<style>
  body { width: 380px; }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 14px; font-weight: 700; letter-spacing: .01em; }
  header a { font-size: 12px; margin-right: 8px; }
  #server-dot { font: 11px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
  #server-dot.on { color: var(--accent); }
  nav { display: flex; border-bottom: 1px solid var(--line); }
  nav button {
    flex: 1; padding: 9px 0; background: none; border: 0; cursor: pointer;
    font-weight: 600; font-size: 12px; color: var(--muted);
    border-bottom: 2px solid transparent;
  }
  nav button.active { color: var(--ink); border-bottom-color: var(--accent); }
  nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  main { max-height: 420px; overflow-y: auto; }
  .row {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  .row input[type=checkbox] { margin-top: 3px; accent-color: var(--accent); }
  .row .meta { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; }
  .row .sub {
    color: var(--muted); font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .acts { display: flex; gap: 6px; }
  footer {
    display: flex; gap: 8px; padding: 12px 16px;
    border-top: 1px solid var(--line); background: var(--wash);
  }
  footer .btn { flex: 1; }
  .empty { padding: 26px 20px; color: var(--muted); text-align: center; }
  .empty code {
    display: block; margin-top: 8px; padding: 6px;
    font: 11px ui-monospace, Menlo, Consolas, monospace;
    background: var(--accent-soft); border-radius: 5px; color: var(--ink);
    user-select: all;
  }
</style>
</head>
<body>
  <header>
    <h1><a href="popup.html" id="back">Back</a>Job finder</h1>
    <span id="server-dot">script: off</span>
  </header>
  <nav>
    <button id="tab-review" class="active" type="button">Review</button>
    <button id="tab-queue" type="button">Queue</button>
  </nav>
  <main id="list"></main>
  <footer>
    <button class="btn" id="refresh" type="button">Check sources</button>
    <button class="btn" id="log-page" type="button">Add this page</button>
    <button class="btn primary" id="fill" type="button">Fill this page</button>
  </footer>
  <div id="toast" role="status"></div>
  <script src="common.js"></script>
  <script src="detect.js"></script>
  <script src="finder.js"></script>
</body>
</html>
